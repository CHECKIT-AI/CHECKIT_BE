<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CheckIt 이메일 인증</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 540px; margin: 3rem auto; padding: 0 1rem; }
  button, input { font: inherit; }
  button { padding: .5rem 1rem; }
  label { display: block; margin: 1rem 0; }
</style>
<h1>이메일 인증</h1>
<p>메일에서 이 페이지를 열었다면 아래 버튼을 눌러 가입을 완료하세요.</p>
<button id="confirm" disabled>이메일 인증 완료</button>
<p id="status" role="status" aria-live="polite">인증 링크를 확인하는 중입니다.</p>
<p>링크가 만료되었거나 예전 메일의 링크가 Swagger로 열린다면 새 메일을 요청하세요.</p>
<form id="resend">
  <label>가입한 이메일 <input id="email" type="email" autocomplete="email" required></label>
  <button type="submit">인증 메일 다시 보내기</button>
</form>
<p><a href="/dev/analysis-test">가입을 완료했다면 이메일 로그인하기</a></p>
<script>
  const status = message => { document.getElementById('status').textContent = message; };
  const token = new URLSearchParams(location.hash.slice(1)).get('token');
  history.replaceState(null, '', location.pathname);
  const request = async (path, body) => {
    const csrfResponse = await fetch('/api/auth/csrf', {credentials: 'include'});
    const csrfBody = await csrfResponse.json();
    if (!csrfResponse.ok) throw Error(csrfBody.error?.message || '보안 토큰 발급 실패');
    const response = await fetch(path, {method: 'POST', credentials: 'include', headers: {
      'Content-Type': 'application/json', 'X-CSRF-Token': csrfBody.csrf_token
    }, body: JSON.stringify(body)});
    const result = await response.json();
    if (!response.ok) throw Error(result.error?.message || '요청 실패');
    return result;
  };
  const confirm = document.getElementById('confirm');
  if (token) {
    confirm.disabled = false;
    status('인증 링크가 준비되었습니다. 인증 완료 버튼을 누르세요.');
  } else {
    status('인증 토큰이 없습니다. 메일의 링크를 다시 열거나 인증 메일을 재발송하세요.');
  }
  confirm.onclick = async () => {
    confirm.disabled = true;
    try {
      await request('/api/auth/email-verification/confirm', {token});
      status('이메일 인증이 완료되었습니다. 아래 링크에서 로그인하세요.');
    } catch (error) {
      status(error.message);
      confirm.disabled = false;
    }
  };
  document.getElementById('resend').onsubmit = async event => {
    event.preventDefault();
    const button = event.currentTarget.querySelector('button');
    button.disabled = true;
    try {
      await request('/api/auth/email-verification/resend', {
        email: document.getElementById('email').value
      });
      status('인증 메일을 발송할 수 있는 계정이라면 새 메일이 전송됩니다. 메일함을 확인하세요.');
    } catch (error) {
      status(error.message);
    } finally {
      button.disabled = false;
    }
  };
</script>
</html>
